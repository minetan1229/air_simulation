name: Issue Auto-Solver & PR

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  solve-issue:
    name: Auto-Solve Issue and Create PR
    runs-on: ubuntu-24.04
    if: "!contains(github.event.issue.labels.*.name, 'wontfix')"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Auto-Solve Issue & Create Verified PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_SLUG: ${{ github.repository }}
          PAPER_AIRCRAFT_BRANCH_GUARD: warn
        run: |
          python tools/auto_solve_issue.py
