name: Python Code Verification

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python 3.11 環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリと検証ツールのインストール
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 構文・フォーマット検証 (Ruff)
        run: ruff check .

      - name: 自動テストの実行 (Pytest)
        run: |
          set -o pipefail
          python -m pytest -ra --tb=short 2>&1 | tee test_output.log

      - name: テストサマリーの出力
        if: always()
        run: |
          if [ -f test_output.log ]; then
            echo "### Pytest Result Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "FAILED|ERROR|passed in|failed in|errors in" test_output.log | tail -n 50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi