name: Python Code Verification

on:
  push:
    # The genetic-project phase is isolated from master, so its own branch
    # has to be verified too.
    branches: [ "master", "genetic-project" ]
  pull_request:
    branches: [ "master" ]

# The branch guard refuses to run the suite on a protected branch.  Inside CI
# the checkout is the triggering ref - ``actions/checkout`` creates a local
# branch on push and a detached HEAD on a pull request - so the branch name
# says nothing about where the work was authored and the suite must not abort
# there.  The protection of a local clone is untouched: this setting only
# applies to this workflow's environment.
env:
  PAPER_AIRCRAFT_BRANCH_GUARD: warn

jobs:
  verify:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python 3.11 環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリと検証ツールのインストール
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 構文・スタイル検証 (Ruff)
        run: ruff check .

      - name: 静的型検査 (Mypy)
        run: mypy --config-file mypy.ini physics app.py

      - name: 自動テストの実行 (Pytest)
        id: pytest_step
        run: python tools/run_ci_tests.py

      - name: テスト失敗時のIssue起票
        if: failure() && steps.pytest_step.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_SUMMARY_FILE: pytest_failure_summary.txt
        run: python tools/create_failure_issue.py

      - name: テスト成功時の解決済みIssue自動クローズ
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/close_resolved_issue.py