name: Python Code Verification

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python 3.11 環境のセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリと検証ツールのインストール
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 構文・スタイル検証 (Ruff)
        run: ruff check .

      - name: 静的型検査 (Mypy)
        run: mypy physics app.py

      - name: 自動テストの実行 (Pytest)
        run: python tools/run_ci_tests.py