name: Python Code Verification

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      issues: write
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python 3.11 環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリと検証ツールのインストール
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: バイトコンパイル (構文検証)
        run: python -m compileall -q physics api tools app.py smoke_test.py

      - name: 構文・スタイル検証 (Ruff)
        run: ruff check .

      - name: 静的型検査 (Mypy)
        run: mypy --config-file mypy.ini physics api app.py smoke_test.py

      - name: 自動テストの実行 (Pytest)
        id: pytest_step
        run: python tools/run_ci_tests.py

      - name: E2E スモークテスト (Smoke Test)
        run: python smoke_test.py

      - name: テスト失敗時のIssue起票
        if: failure() && steps.pytest_step.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_SUMMARY_FILE: pytest_failure_summary.txt
        run: python tools/create_failure_issue.py

      - name: テスト成功時の解決済みIssue自動クローズ
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/close_resolved_issue.py
