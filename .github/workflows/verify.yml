name: Python Code Verification

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Type Check & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python 3.11 環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリと検証ツールのインストール
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 構文・スタイル検証 (Ruff)
        run: ruff check .

      - name: 静的型検査 (Mypy)
        run: mypy --config-file mypy.ini physics app.py

      - name: 自動テストとカバレッジ計測 (Pytest)
        run: |
          python -m pytest -ra --tb=short --cov=physics --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: カバレッジレポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  windows-tests:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python 3.11 環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: 自動テストの実行
        run: python -m pytest -ra --tb=short
