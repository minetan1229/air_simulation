name: Python Code Verification

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python 3.11 環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリと検証ツールのインストール
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 構文・フォーマット検証 (Ruff)
        run: ruff check .

      - name: 自動テストの実行 (Pytest)
        run: |
          set -o pipefail
          python -m pytest -ra --tb=short 2>&1 | tee test_output.log

      - name: テストサマリーの出力
        if: always()
        run: |
          if [ -f test_output.log ]; then
            echo "### Pytest Result Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "FAILED|ERROR|passed in|failed in|errors in" test_output.log | tail -n 50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: テストログのアーティファクト保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: test_output.log
          if-no-files-found: ignore

      - name: テスト失敗詳細の通知
        if: failure()
        run: |
          python -c '
import json, urllib.request
try:
    with open("test_output.log", "r", encoding="utf-8", errors="ignore") as f:
        lines = f.read().splitlines()
    failed = [l for l in lines if "FAILED " in l or "ERROR " in l or "failures in" in l or "failed in" in l]
    summary = "\n".join(failed[-20:]) if failed else "Pytest failed; see artifact"
    payload = {"content": f"⚠️ **CI Pytest Failure Details**:\n```\n{summary[:1800]}\n```"}
    req = urllib.request.Request("https://discord.com/api/webhooks/1559481959061782528/n8lndbZf9zWCjv9LRs9CPL_XcavqKWkvR1bD8C8ffIevAXymTS8f9NtJZGjdDU6OcVIE", data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"})
    urllib.request.urlopen(req)
except Exception as e:
    print("Failed to post notification:", e)
'