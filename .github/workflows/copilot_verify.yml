name: Copilot Review & Auto-Verify

on:
  push:
    branches:
      - "feat/*"
      - "fix/*"
      - "genetic-project"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  review-and-verify:
    name: Copilot Review, Verify & Conditional Auto-Fix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Review & Verification Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAPER_AIRCRAFT_BRANCH_GUARD: warn
        run: |
          python tools/copilot_verify_action.py
