name: CI Pipeline

on:
  push:
    # The genetic-project phase is carried out on its own branch (master is
    # protected by tools/branch_guard.py), so that branch has to be verified
    # by CI as well.
    branches: [ "master", "feat/*", "fix/*", "genetic-project" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The branch guard refuses to run the suite on a protected branch.  Inside CI
# the checkout is the triggering ref - ``actions/checkout`` creates a local
# branch on push and a detached HEAD on a pull request - so the branch name
# says nothing about where the work was authored and the suite must not abort
# there.  The protection of a local clone is untouched: this setting only
# applies to this workflow's environment.
env:
  PAPER_AIRCRAFT_BRANCH_GUARD: warn

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Static Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lint & Typecheck Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax & Style Lint (Ruff)
        run: ruff check .

      # The console is an ES module graph: one module that does not parse
      # leaves the application without any JavaScript at all.  The check needs
      # the Node.js runtime the GitHub runners ship with.
      - name: Front-End Module Parse (ES module goal)
        run: python tools/check_js_modules.py

      # The console type scale and the shell grid are checked statically, so
      # a layout regression does not have to be found by eye.
      - name: Console Style Invariants
        run: python tools/check_ui_css.py

      - name: Static Type Check (Mypy)
        run: mypy --config-file mypy.ini core physics geometry optimization infrastructure api app.py

  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Optional test extras aligned with verify.yml so printable A4 and
          # discord bridge tests run consistently across the CI matrix.
          pip install "discord.py>=2.7.1,<3.0" "psutil>=7.2.2" "matplotlib>=3.8"

      - name: Run Unit Tests
        run: pytest tests -q --tb=short

      - name: Run End-to-End Smoke Test
        run: python scripts/smoke_test.py

  security-audit:
    name: Security Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit & Dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pip-audit Dependency Scan
        run: pip-audit --desc on
