name: CI Pipeline

on:
  push:
    branches: [ "master", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  issues: write

jobs:
  lint-and-typecheck:
    name: Lint & Static Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lint & Typecheck Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Byte-compile (Syntax Check)
        run: python -m compileall -q physics api tools app.py smoke_test.py

      - name: Syntax & Style Lint (Ruff)
        run: ruff check .

      - name: Static Type Check (Mypy)
        run: mypy --config-file mypy.ini physics api app.py smoke_test.py

  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests with Coverage
        run: pytest tests -q --tb=short

      - name: Run End-to-End Smoke Test
        run: python smoke_test.py

  security-audit:
    name: Security Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # The audit covers the *declared* dependency set, not the whole
      # environment: auditing the environment also reports the advisories of
      # the pip/setuptools build tooling itself, which are not part of the
      # shipped application.  A finding here fails the build.
      - name: Run pip-audit Dependency Scan
        run: pip-audit -r requirements.txt --progress-spinner off
