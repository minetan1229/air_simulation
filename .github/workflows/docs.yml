name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - mkdocs.yml
      - mkdocs.en.yml
      - requirements-docs.txt
      - README.md
      - README.en.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material pymdown-extensions "mkdocstrings[python]"

      - name: Build Japanese documentation
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --config-file mkdocs.yml --site-dir site

      - name: Build English documentation
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --config-file mkdocs.en.yml --site-dir site/en

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
