# Mypy configuration for 3D Paper Airplane CFD Simulator
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = normal
show_error_codes = True
warn_redundant_casts = False
warn_unused_ignores = False
pretty = True
check_untyped_defs = True

# Relax strict type checks for large numerical simulation engine modules
[mypy-physics.mesh_domain]
ignore_errors = True

[mypy-physics.flight_sim]
ignore_errors = True

[mypy-physics.auto_investigate]
ignore_errors = True

[mypy-physics.*]
ignore_missing_imports = True

[mypy-trimesh.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-cupy.*]
ignore_missing_imports = True
