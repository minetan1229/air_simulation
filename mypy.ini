# Mypy configuration for 3D Paper Airplane CFD Simulator
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = normal
show_error_codes = True
warn_redundant_casts = True
warn_unused_ignores = False
pretty = True
check_untyped_defs = True
warn_return_any = False
warn_unused_configs = True

# Every module in `physics` is type checked.  The three large numerical
# modules used to be excluded with `ignore_errors = True`, which silently
# voided the static analysis for the RK4 integrator, the mesh parsers and the
# investigation pipeline.  Their type errors are fixed instead.
[mypy-physics.*]
ignore_missing_imports = True

[mypy-trimesh.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-cupy.*]
ignore_missing_imports = True
