    <!-- ---------- right rail : instrumentation ---------- -->
    <aside class="rail rail-right" id="rail-right" aria-label="計器">
      <div class="rail-head">
        <span class="rail-title">計器</span>
        <span class="rail-title-en">INSTRUMENTS</span>
        <span class="state-pill" id="flight-pill" data-state="idle">待機</span>
      </div>
      <div class="rail-body">

        <section class="group" open>
          <div class="group-head static"><span class="group-name">飛行状態</span><span class="group-en">STATE</span></div>
          <div class="group-body">
            <dl class="gauges" id="gauges"></dl>
            <div class="kv-line"><span>POSITION x / y / z</span><span class="num" id="gauge-position">—</span></div>
            <div class="kv-line"><span>Re / Ma</span><span class="num" id="gauge-rema">—</span></div>
          </div>
        </section>

        <section class="group" open>
          <div class="group-head static">
            <span class="group-name">記録</span><span class="group-en">RECORDER</span>
            <span class="group-note num" id="rec-count">0</span>
          </div>
          <div class="group-body">
            <div class="rec-head">
              <span class="rec-legend"><i class="sw sw-alt"></i>高度 m</span>
              <span class="rec-legend"><i class="sw sw-spd"></i>速度 m/s</span>
              <span class="rec-legend"><i class="sw sw-aoa"></i>迎角 °</span>
              <span class="rec-legend"><i class="sw sw-sts"></i>応力 Pa</span>
            </div>
            <canvas id="rec-canvas" class="rec-canvas" role="img" aria-label="飛行記録ストリップチャート"></canvas>
            <div class="rec-foot">
              <span class="num" id="rec-cursor">—</span>
              <button class="btn btn-mini" id="btn-rec-clear" type="button">消去</button>
            </div>
          </div>
        </section>

        <section class="group" open>
          <div class="group-head static">
            <span class="group-name">空力極線</span><span class="group-en">DRAG POLAR</span>
            <button class="btn btn-mini" id="btn-polar" type="button">再計算</button>
          </div>
          <div class="group-body">
            <canvas id="polar-canvas" class="polar-canvas" role="img" aria-label="抗力ポラルチャート"></canvas>
            <div class="kv-line"><span>C_D min / α</span><span class="num" id="polar-cdmin">—</span></div>
            <div class="kv-line"><span>(L/D) max / α</span><span class="num" id="polar-ldmax">—</span></div>
            <div class="kv-line"><span>トリム α / δ<sub>e</sub></span><span class="num" id="polar-trim">—</span></div>
          </div>
        </section>

        <section class="group" open>
          <div class="group-head static"><span class="group-name">大気</span><span class="group-en">AIR</span></div>
          <div class="group-body">
            <dl class="gauges gauges-2" id="gauges-air"></dl>
          </div>
        </section>

      </div>
    </aside>
  </main>
