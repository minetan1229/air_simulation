site_name: 3D Paper Airplane Simulator
site_description: 6DoF RK4 飛行力学 × 低 Re 空力 × GPU 並列最適化の紙飛行機シミュレーション基盤
site_author: minetan1229
site_url: https://minetan1229.github.io/air_simulation/
repo_name: minetan1229/air_simulation
repo_url: https://github.com/minetan1229/air_simulation
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  language: ja
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ライト/ダーク
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      toggle:
        icon: material/brightness-4
        name: ダーク/ライト
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.index
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.view
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.extra
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
  alternate:
    - name: 日本語
      link: /air_simulation/
      lang: ja
    - name: English
      link: /air_simulation/en/
      lang: en

plugins:
  - search:
      lang: ja
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_root_heading: false

nav:
  - ホーム: index.md
  - 導入ガイド:
      - クイックスタート: getting-started.md
      - 操作マニュアル: usage.md
      - トラブルシューティング: troubleshooting.md
  - 物理・理論:
      - 技術仕様 (正本): SPECIFICATION.md
      - 物理モデル正本: PHYSICS_MODELS.md
      - 物理計算アルゴリズム: PHYSICS_ALGORITHM.md
      - 検証と妥当性確認 (V&V): VALIDATION.md
      - 学術文献調査 (Domain 1-6): research/paper_survey_master_index.md
      - アーキテクチャ: architecture.md
      - 物理ロードマップ: PHYSICS_ROADMAP.md
  - 高校生向け解説:
      - 飛行機物理入門: PHYSICS_HIGH_SCHOOL.md
      - 遺伝的アルゴリズム入門: GA_HIGH_SCHOOL.md
  - API リファレンス:
      - REST API 仕様: api.md
      - OpenAPI (Swagger UI): https://github.com/minetan1229/air_simulation#api-リファレンス
  - 開発・運用:
      - 開発ガイド: development.md
      - GA アルゴリズム: GA_ALGORITHM.md
      - GA V2 アーキテクチャ: GA_V2_ARCHITECTURE.md
      - CFD ロードマップ: CFD_ROADMAP.md
      - 紙レジストリパイプライン: PAPER_REGISTRY_PIPELINE.md
      - Discord ブリッジ: discord-bridge.md
      - リモート計算環境: REMOTE_COMPUTE_ENVIRONMENT.md
      - コードレビュー知見: CODE_REVIEW_FINDINGS.md
