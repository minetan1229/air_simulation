[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# tools/ contains ad-hoc investigation scripts (some of which simulate a full
# flight at import time).  Never let pytest collect outside tests/.
norecursedirs = tools search archive artifacts wiki-docs .venv .git build dist
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
