# Configuration for milcy Algorithm (formerly v3) 3D MAP-Elites Autonomous Research Framework
# Production deterministic configuration tuned for high-resolution illumination
# Grid ranges calibrated to empirical origami distribution (WL: 0.179-0.222, AR: 0.597-0.698)

search:
  seed: 42
  bootstrap_count: 8
  mcts_iterations: 40
  map_elites_iterations: 100
  mutation_rate: 0.35

grid:
  bins: [10, 10, 10]  # 1,000 behavior niches
  wing_loading_range: [0.12, 0.28]
  stability_range: [0.25, 0.95]
  aspect_ratio_range: [0.45, 1.10]

benchmark:
  low_speed_mps: 6.0
  mid_speed_mps: 10.0
  duration_s: 6.0
  dt_max: 0.02
  launch_height_m: 1.5

trim:
  enabled: true
  max_iterations: 25
  elevon_bounds_deg: [-4.0, 8.0]
  dihedral_bounds_deg: [0.0, 8.0]

evaluation:
  dryden_duration_s: 6.0
  top_k_export: 5
  output_dir: "output/milcy"
