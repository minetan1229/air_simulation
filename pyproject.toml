[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-airplane-sim"
version = "3.0.0"
description = "High-Performance 3D Paper Airplane Aerodynamics and 6DoF Flight Simulation Suite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Engineering Team"}
]
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "cupy-cuda12x>=13.0.0",
    "trimesh>=4.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
]
torch = [
    "torch>=2.1.0",
]

# NOTE: ruff / mypy / pytest are configured exclusively in ruff.toml,
# mypy.ini and pytest.ini.  Tool configuration in pyproject.toml is
# silently ignored because the dedicated files take precedence, which
# previously allowed the two sources to drift apart.  Keep this file
# limited to packaging metadata.
