[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-airplane-sim"
version = "3.0.0"
description = "High-Performance 3D Paper Airplane Aerodynamics and 6DoF Flight Simulation Suite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Engineering Team"}
]
dependencies = [
    "Flask>=3.1.3,<4.0.0",
    "numpy>=1.24.0",
    "scipy>=1.15.3",
    "trimesh>=5.1.1",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
]
gpu = [
    "cupy-cuda12x>=13.0.0",
]
bridge = [
    "discord.py>=2.7.1,<3.0",
    "psutil>=7.2.2",
]
