# Ruff configuration for 3D Paper Airplane CFD Simulator
line-length = 120
# Keep in sync with requires-python in pyproject.toml (>=3.10); the CI matrix
# exercises Python 3.10, so 3.11-only syntax must not be assumed.
target-version = "py310"

exclude = [
    ".git",
    ".venv",
    ".kilo",
    ".codex",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "models",
    "runs",
    "jobs",
    "logs",
    "artifacts",
    "archive",
    "build",
    "dist",
    "wiki-docs",
    "tools/experiments",
]

[lint]
select = [
    "E",
    "F",
    "W",
]
ignore = [
    "E501",  # line length
    "E402",  # module import not at top (needed for sys.path configuration)
    "E731",  # lambda assignment
    "E741",  # single-letter variables (e.g. l for lift/length in aero formulas)
    "F401",  # unused imports in __init__ or re-exports
    "F841",  # unused variables in scientific formulas / unpacks
]
